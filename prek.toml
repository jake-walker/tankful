[[repos]]
repo = "https://github.com/nicklockwood/SwiftFormat"
rev = "0.63.0"
hooks = [{ id = "swiftformat" }]

[[repos]]
repo = "https://github.com/crate-ci/typos"
rev = "v1.50.2"
hooks = [{ id = "typos" }]

[[repos]]
repo = "builtin"
hooks = [
  { id = "trailing-whitespace", args = [
    "--markdown-linebreak-ext=md",
  ] },
  { id = "check-added-large-files", args = [
    "--maxkb=1024",
  ] },
  { id = "mixed-line-ending" },
]

[[repos]]
repo = "https://github.com/commitizen-tools/commitizen"
rev = "v4.18.0"
hooks = [
  { id = "commitizen", stages = [
    "commit-msg",
  ] },
  { id = "commitizen-branch", stages = [
    "pre-push",
  ] },
]

[[repos]]
repo = "https://github.com/KAUTH/git-lfs-hooks"
rev = "v3.3.0"
hooks = [
  { id = "post-checkout" },
  { id = "post-commit" },
  { id = "post-merge" },
  { id = "pre-push" },
]
