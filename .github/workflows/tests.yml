name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    runs-on: xcode-27
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
      - name: Run prek hooks
        uses: j178/prek-action@v3.0.1
      - name: Run Swift tests
        env:
          SKIP_PLUGIN_DISABLED: "1"
          SKIP_ACTION: none
        run: swift test
